services:
  qdrant:
    image: qdrant/qdrant:v1.11.3
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.1
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
    ports:
      - "9200:9200"
  rag-api:
    build: .
    env_file: .env
    ports:
      - "8000:8000"
    depends_on:
      - qdrant
      - elasticsearch
volumes:
  qdrant_data:
